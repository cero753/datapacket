[project]
name = "datapacket"
version = "0.1.0"
description = "Turn a company's emails, Slack, tickets and SOPs into a de-identified, lab-ready data packet: identity graph, PII scrubbing with measured recall, and a verifiable ticket-resolution RL environment."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kartik Bhardwaj", email = "kartikbhardwaj753@gmail.com" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.10,<2"]
ner = [
    "cymem<2.0.12",
    "en-core-web-md",
    "preshed>=3.0,<3.0.10",
    "presidio-analyzer>=2.2",
    "spacy>=3.7,<3.8.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
datapacket = "datapacket.cli:main"
datapacket-mcp = "datapacket.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
